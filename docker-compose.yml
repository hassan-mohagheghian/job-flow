services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: jobsearch
      POSTGRES_DB: jobsearch
    ports:
      - "5432:5432"
    volumes:
      - jobsearch-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  alembic:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+psycopg://jobsearch:jobsearch@postgres:5432/jobsearch
      - AI_PROVIDER=${AI_PROVIDER:-opencode}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://jobsearch:jobsearch@postgres:5432/jobsearch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_PROVIDER=${AI_PROVIDER:-opencode}
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - jobsearch-backups:/app/backups

  background:
    build:
      context: .
      dockerfile: Dockerfile.background
    environment:
      - DATABASE_URL=postgresql+psycopg://jobsearch:jobsearch@postgres:5432/jobsearch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_PROVIDER=${AI_PROVIDER:-opencode}
      - WORKER_CONCURRENCY=4
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.background
    command: uv run taskiq scheduler apps.backend.entrypoints.scheduler:create_scheduler shared.infrastructure.taskiq.tasks
    environment:
      - DATABASE_URL=postgresql+psycopg://jobsearch:jobsearch@postgres:5432/jobsearch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_PROVIDER=${AI_PROVIDER:-opencode}
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install && npm run dev -- --port 5173 --hostname 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000
      - BACKEND_URL=http://backend:5000

volumes:
  jobsearch-pg-data:
    external: true
  jobsearch-backups: