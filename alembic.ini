# Alembic configuration for multi-schema, multi-context migrations.

[alembic]
script_location = apps/alembic
prepend_sys_path = apps/backend
version_locations = apps/alembic/auth/versions apps/alembic/job/versions apps/alembic/company/versions apps/alembic/skill/versions apps/alembic/shared/versions apps/alembic/candidate/versions apps/alembic/application/versions apps/alembic/roadmap/versions apps/alembic/placeholders/versions apps/alembic/city/versions apps/alembic/processing/versions apps/alembic/ai/versions apps/alembic/opportunity/versions
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S